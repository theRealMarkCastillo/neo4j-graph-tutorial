[pytest]
testpaths = tests
# Fast, deterministic tests by default. LLM evals cost money and vary run to run,
# so they only run when asked for:  pytest -m llm
addopts = -m "not llm" -ra
markers =
    db: needs the Neo4j container running (skipped if it isn't)
    llm: calls the real LLM endpoint from .env (opt in with -m llm)
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
