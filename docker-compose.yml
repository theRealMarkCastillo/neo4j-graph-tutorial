services:
  neo4j:
    build: .
    container_name: neo4j-graph-tutorial
    ports:
      - "7474:7474" # Neo4j Browser  -> http://localhost:7474
      - "7687:7687" # Bolt (drivers) -> neo4j://localhost:7687
    environment:
      # Only applied when the database is first created; changing it later needs
      # ALTER USER in Cypher (or wiping the neo4j_data volume).
      NEO4J_AUTH: "${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env}"
    volumes:
      - neo4j_data:/data
      - neo4j_plugins:/plugins
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u $${NEO4J_AUTH%%/*} -p $${NEO4J_AUTH#*/} 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s
    restart: unless-stopped

volumes:
  neo4j_data:
  neo4j_plugins:
  neo4j_logs:
